org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# connectedDebugAndroidTest otherwise uninstalls the app afterwards, which would delete the app's data (on a phone: the library and
# the login) and the smoke tests' screenshots. The emulator-only suite is described in docs/GUIDE.md, section 3.
android.injected.androidTest.leaveApksInstalledAfterRun=true
